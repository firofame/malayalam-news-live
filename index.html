<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07090f">
    <title>Malayalam News Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">
                <div class="eyebrow"><span class="pulse"></span>Live now</div>
                <h1>Malayalam News</h1>
            </div>
            <div class="clock" id="clock">--:--</div>
        </header>

        <section class="player-card" aria-label="Live player">
            <div class="video-shell" id="videoShell">
                <button class="poster" id="poster" type="button" aria-label="Play stream">
                    <span class="poster-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                    </span>
                </button>
            </div>
        </section>
    </main>

    <!-- Floating bottom dock: play/pause + channel strip -->
    <div class="bottom-dock">
        <button class="play-toggle" id="playToggle" type="button" aria-label="Play stream">
            <svg class="fab-icon fab-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
            <svg class="fab-icon fab-icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
            <span class="fab-ripple" id="fabRipple"></span>
        </button>
        <nav class="rail" id="quickRail" aria-label="Channels">
            <div class="rail-track"></div>
            <div class="volume" id="volumeControl">
                <button class="volume-btn" id="volumeBtn" type="button" aria-label="Mute stream">
                    <svg class="volume-icon volume-icon-high" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>
                    <svg class="volume-icon volume-icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"></path><path class="volume-x" d="M15.5 9.5l5.5 5.5M21 9.5L15.5 15" fill="none"></path></svg>
                </button>
                <button class="volume-step" id="volumeDown" type="button" aria-label="Volume down">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13H5v-2h14v2z"></path></svg>
                </button>
                <input class="volume-slider" id="volumeSlider" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
                <button class="volume-step" id="volumeUp" type="button" aria-label="Volume up">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"></path></svg>
                </button>
            </div>
            <button class="play-toggle rail-play" id="railPlay" type="button" aria-label="Play stream">
                <svg class="fab-icon fab-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                <svg class="fab-icon fab-icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
            </button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
